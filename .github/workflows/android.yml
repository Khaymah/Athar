name: Android

on:
  push:
    branches: [athkar-app]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, e.g. v0.3.0 (empty = build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keeps playing with screen off and device in Doze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/smoke-test.sh

  build:
    needs: smoke
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Refuse unsigned release
        if: env.RELEASE_TAG != '' && steps.keystore.outputs.signed != 'true'
        run: |
          echo "::error::KEYSTORE_BASE64 secret is missing; a tagged release must be signed with the permanent key."
          exit 1
      - name: Build
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || format('0.0.{0}', github.run_number) }}
        run: |
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            KEYSTORE_PATH="$KEYSTORE_FILE" ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/athar-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/athar-$VERSION_NAME-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: athar-apk
          path: dist/*.apk
      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "أثر $RELEASE_TAG" \
            --notes "نزّل ملف الـ APK وثبّته. التحديث بيتثبّت فوق النسخة القديمة من غير ما الإعدادات تتمسح."
