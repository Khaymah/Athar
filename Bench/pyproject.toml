[project]
name = "dialect-tax"
version = "0.1.0"
description = "Measure how much coding-agent performance drops when tasks are written in Arabic dialects instead of English."
requires-python = ">=3.11"
dependencies = [
    "swebench>=5.0",
    "mini-swe-agent>=2.4",
    "datasets>=3.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dialect-tax = "dialect_tax.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dialect_tax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
