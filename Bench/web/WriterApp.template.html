<title>ورشة ضريبة اللهجة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky task bar on top; below it two columns: the brief (units + attachments, sticky) and the editor (tabs per variant). Stacks on phones. Dark IDE look by default; light only when explicitly chosen. */
:root {
  --bg: #14171c;
  --panel: #1a1e24;
  --raised: #20252d;
  --sunken: #0f1216;
  --line: #2a313b;
  --fg: #d5dbe3;
  --muted: #8b95a4;
  --accent: #5aa9e6;
  --accent-ink: #0d1b26;
  --token: #c4a3f2;
  --ok: #67c38a;
  --warn: #d8aa52;
  --bad: #ef7f76;
  --font-ui: "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f6f9; --panel: #ffffff; --raised: #f0f3f7; --sunken: #eaeef3; --line: #d5dce5; --fg: #1b2129; --muted: #5d6877;
  --accent: #1f6fb2; --accent-ink: #ffffff; --token: #7b4cc2; --ok: #237a45; --warn: #925f00; --bad: #b4261d;
  color-scheme: light;
}
html, body { direction: rtl; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15.5px; line-height: 1.75; text-align: right; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.brand small { display: block; font-weight: 400; font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.picker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1 1 420px; min-width: 0; }
select, .iconbtn { font: inherit; font-size: 0.9rem; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; height: 36px; }
select { padding: 0 10px; min-width: 0; }
#taskSelect { flex: 1 1 260px; max-width: 460px; }
.iconbtn { width: 36px; cursor: pointer; display: inline-grid; place-items: center; font-size: 1rem; }
.iconbtn:disabled { opacity: 0.4; cursor: default; }
.pos { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-start: auto; }
.track { width: 120px; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; display: flex; }
.track span { height: 100%; }
#barSubmitted { background: var(--ok); } #barClaimed { background: var(--warn); }
.textbtn { font: inherit; font-size: 0.82rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
.textbtn:hover { color: var(--fg); }

.notice { margin-top: 12px; padding: 9px 14px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); border-inline-start: 3px solid var(--warn); font-size: 0.9rem; }

main.wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; padding-block: 16px 40px; align-items: start; }
@media (max-width: 960px) { main.wrap { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.pane-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pane-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; unicode-bidi: isolate; }
.pane-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.brief { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 92px); overflow-y: auto; }
@media (max-width: 960px) { .brief { position: static; max-height: none; } }
h3 { margin: 0 0 8px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }

.chip { font-size: 0.75rem; padding: 0 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); line-height: 1.8; }
.chip.mine { color: var(--accent); border-color: var(--accent); }
.chip.done { color: var(--ok); border-color: var(--ok); }

ol.units { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: u; }
ol.units li { counter-increment: u; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
ol.units li::before { content: counter(u); font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; text-align: center; line-height: 22px; height: 24px; margin-top: 3px; }
.unit-ar { font-size: 0.97rem; overflow-wrap: anywhere; }
.unit-en { direction: ltr; text-align: left; font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
code { font-family: var(--font-mono); font-size: 0.85em; background: var(--sunken); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; direction: ltr; unicode-bidi: isolate; }
.ph { font-family: var(--font-mono); font-size: 0.82em; color: var(--token); font-weight: 500; direction: ltr; unicode-bidi: isolate; }
details.att { border: 1px solid var(--line); border-radius: 6px; background: var(--sunken); }
details.att + details.att { margin-top: 6px; }
details.att summary { cursor: pointer; padding: 5px 12px; font-size: 0.85rem; display: flex; gap: 10px; align-items: center; }
details.att pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); overflow-x: auto; direction: ltr; text-align: left; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.55; max-height: 280px; color: var(--fg); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tab { font: inherit; font-size: 0.92rem; background: none; color: var(--muted); border: none; border-bottom: 2px solid transparent; padding: 10px 14px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.editor { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.editor .hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
.inserts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 0.8rem; color: var(--muted); }
.inserts button { font-family: var(--font-mono); font-size: 0.75rem; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--raised); color: var(--token); cursor: pointer; }
textarea { font: inherit; font-size: 0.98rem; line-height: 1.8; width: 100%; min-height: 260px; resize: vertical; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--sunken); color: var(--fg); }
textarea[dir="ltr"] { font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.7; text-align: left; }
.reference { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; font-size: 0.88rem; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow-y: auto; }
.reference strong { color: var(--fg); font-weight: 600; display: block; margin-bottom: 2px; font-size: 0.8rem; }
ul.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 0.84rem; }
ul.checks li { padding-inline-start: 16px; position: relative; }
ul.checks li::before { content: ""; position: absolute; inset-inline-start: 0; top: 0.7em; width: 7px; height: 7px; border-radius: 50%; }
ul.checks li.bad { color: var(--bad); } ul.checks li.bad::before { background: var(--bad); }
ul.checks li.warn { color: var(--warn); } ul.checks li.warn::before { background: var(--warn); }
ul.checks li.ok { color: var(--ok); } ul.checks li.ok::before { background: var(--ok); }
.foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
.foot .actions { margin-inline-start: auto; display: flex; gap: 8px; }
.status-line { color: var(--muted); font-size: 0.84rem; }
.btn { font: inherit; font-size: 0.92rem; font-weight: 600; padding: 6px 18px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.gate { padding: 36px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.gate strong { font-size: 1.1rem; }
.gate p { margin: 0; color: var(--muted); max-width: 46ch; }
details.rules { border-bottom: 1px solid var(--line); }
details.rules summary { cursor: pointer; padding: 10px 16px; font-size: 0.88rem; color: var(--muted); }
details.rules ul { margin: 0; padding: 0 36px 12px 16px; display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; }
textarea:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); background: var(--raised); color: var(--fg); border: 1px solid var(--line); border-inline-start: 3px solid var(--accent); padding: 8px 14px; border-radius: 6px; font-size: 0.88rem; z-index: 20; max-width: calc(100vw - 32px); }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .iconbtn { transition: color .15s, background-color .15s, border-color .15s; } }
</style>

<div dir="rtl" lang="ar-EG">
<header class="bar">
  <div class="wrap">
    <div class="brand">ورشة ضريبة اللهجة<small>طلبات bugs حقيقية، بالإنجليزي والمصري والفرانكو</small></div>
    <div class="picker">
      <label for="filterSelect" class="pos">عرض</label>
      <select id="filterSelect">
        <option value="all">كل التاسكات</option>
        <option value="free">المتاح للحجز</option>
        <option value="mine">بتاعي</option>
        <option value="done">اللي اتسلّم</option>
      </select>
      <button class="iconbtn" id="prevBtn" type="button" aria-label="التاسك اللي قبله">→</button>
      <select id="taskSelect" aria-label="اختار تاسك"></select>
      <button class="iconbtn" id="nextBtn" type="button" aria-label="التاسك اللي بعده">←</button>
      <span class="pos" id="posText"></span>
    </div>
    <div class="meter" aria-live="polite">
      <div class="track" aria-hidden="true"><span id="barSubmitted"></span><span id="barClaimed"></span></div>
      <span id="meterText"></span>
      <button class="textbtn" id="themeBtn" type="button">فاتح</button>
    </div>
  </div>
</header>

<div class="wrap"><div class="notice" id="notice" hidden></div></div>

<main class="wrap">
  <section class="pane brief" aria-labelledby="briefTitle">
    <div class="pane-head">
      <h2 id="briefTitle">المطلوب</h2>
      <span class="chip" id="statusChip"></span>
    </div>
    <div class="pane-body" id="briefBody"></div>
  </section>

  <section class="pane" aria-label="الكتابة" id="editorPane"></section>
</main>

<div class="toast" id="toast" role="status" hidden></div>
</div>

<script type="application/json" id="cards">/*__CARDS__*/</script>
<script>
(() => {
  document.documentElement.dir = "rtl";
  document.documentElement.lang = "ar-EG";
  const CARDS = JSON.parse(document.getElementById("cards").textContent);
  const BY_ID = Object.fromEntries(CARDS.map(c => [c.instance_id, c]));
  const VARIANTS = [
    { key: "en", label: "إنجليزي", dir: "ltr", script: "latin", hint: "اكتب الطلب بالإنجليزي زي ما بتكتبه لـ agent عادي." },
    { key: "egy", label: "مصري", dir: "rtl", script: "arabic", hint: "بحروف عربي، بالخلط الطبيعي بتاعك (الـ function، الـ error...). متترجمش الإنجليزي حرفياً." },
    { key: "franco", label: "فرانكو", dir: "ltr", script: "latin", hint: "نفس المصري اللي كتبته، بس بالفرانكو (3، 7، 2...) زي ما بتكتب على واتساب." },
  ];
  const PROJECTS = { "django/django": "Django", "sympy/sympy": "SymPy", "matplotlib/matplotlib": "Matplotlib", "sphinx-doc/sphinx": "Sphinx",
    "scikit-learn/scikit-learn": "scikit-learn", "astropy/astropy": "Astropy", "pydata/xarray": "xarray", "pytest-dev/pytest": "pytest",
    "pylint-dev/pylint": "Pylint", "mwaskom/seaborn": "seaborn" };
  const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
  const projectName = repo => PROJECTS[repo] || repo.split("/").pop();
  const taskLabel = c => `${projectName(c.repo)} #${c.instance_id.split("-").pop()}`;
  const $ = id => document.getElementById(id);

  const state = { uid: null, canWrite: null, db: null, dbReady: false, claims: {}, mine: {}, selected: null, filter: "all", tab: "en" };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const theme = store.get("dt-theme", "dark");
  if (theme === "light") document.documentElement.dataset.theme = "light";
  $("themeBtn").textContent = theme === "light" ? "غامق" : "فاتح";
  $("themeBtn").addEventListener("click", () => {
    const light = document.documentElement.dataset.theme !== "light";
    if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
    $("themeBtn").textContent = light ? "غامق" : "فاتح";
    store.set("dt-theme", light ? "light" : "dark");
  });

  function toast(text) {
    const t = $("toast"); t.textContent = text; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 3200);
  }
  function notice(text) { const n = $("notice"); n.textContent = text || ""; n.hidden = !text; }

  function taskStatus(id) {
    const claim = state.claims[id];
    if (!claim || !claim.uid) return "free";
    if (claim.status === "submitted") return claim.uid === state.uid ? "done-mine" : "done";
    return claim.uid === state.uid ? "mine" : "taken";
  }
  const STATUS = {
    free: ["", "متاح للحجز"], mine: ["mine", "محجوز لك"], taken: ["", "مع كاتب تاني"],
    "done-mine": ["done", "سلّمته"], done: ["done", "اتسلّم"],
  };
  function visibleTasks() {
    return CARDS.filter(c => {
      const s = taskStatus(c.instance_id);
      if (state.filter === "free") return s === "free";
      if (state.filter === "mine") return s === "mine" || s === "done-mine";
      if (state.filter === "done") return s === "done" || s === "done-mine";
      return true;
    });
  }

  function renderMeter() {
    let submitted = 0, claimed = 0;
    for (const c of CARDS) {
      const s = taskStatus(c.instance_id);
      if (s === "done" || s === "done-mine") submitted++; else if (s !== "free") claimed++;
    }
    $("barSubmitted").style.width = (100 * submitted / CARDS.length) + "%";
    $("barClaimed").style.width = (100 * claimed / CARDS.length) + "%";
    $("meterText").textContent = `${AR(submitted)} من ${AR(CARDS.length)} اتسلّم`;
  }

  function renderPicker() {
    const list = visibleTasks();
    const sel = $("taskSelect");
    sel.textContent = "";
    if (!list.length) {
      const o = document.createElement("option"); o.textContent = "مفيش تاسكات في العرض ده"; o.disabled = true; sel.append(o);
    }
    for (const c of list) {
      const o = document.createElement("option");
      o.value = c.instance_id;
      o.textContent = `${taskLabel(c)}  ·  ${STATUS[taskStatus(c.instance_id)][1]}`;
      sel.append(o);
    }
    const idx = list.findIndex(c => c.instance_id === state.selected);
    if (idx >= 0) sel.value = state.selected;
    $("posText").textContent = idx >= 0 ? `${AR(idx + 1)} من ${AR(list.length)}` : `${AR(list.length)} تاسك`;
    $("prevBtn").disabled = idx <= 0;
    $("nextBtn").disabled = idx < 0 || idx >= list.length - 1;
    renderMeter();
  }

  function inlineRich(text, el) {
    for (const p of text.split(/(`[^`]+`|\[\[A\d+\]\])/g)) {
      if (!p) continue;
      if (p.startsWith("`") && p.endsWith("`") && p.length > 1) { const c = document.createElement("code"); c.textContent = p.slice(1, -1); el.append(c); }
      else if (/^\[\[A\d+\]\]$/.test(p)) { const s = document.createElement("span"); s.className = "ph"; s.textContent = p; el.append(s); }
      else el.append(document.createTextNode(p));
    }
    return el;
  }
  function div(className, attrs) { return Object.assign(document.createElement("div"), { className }, attrs || {}); }

  function renderBrief() {
    const id = state.selected, body = $("briefBody");
    body.textContent = "";
    if (!id) return;
    const card = BY_ID[id], s = taskStatus(id);
    $("briefTitle").textContent = taskLabel(card);
    $("briefTitle").title = id;
    const chip = $("statusChip");
    chip.className = "chip " + STATUS[s][0];
    chip.textContent = STATUS[s][1];

    const unitsBox = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = "اللي لازم طلبك يوصّله (كله، ومن غير زيادة)";
    const ol = document.createElement("ol"); ol.className = "units";
    card.units.forEach((u, i) => {
      const li = document.createElement("li");
      const box = document.createElement("div");
      if (card.units_ar && card.units_ar[i]) box.append(inlineRich(card.units_ar[i], div("unit-ar")));
      box.append(inlineRich(u, div("unit-en", { lang: "en" })));
      li.append(box); ol.append(li);
    });
    unitsBox.append(h, ol);
    body.append(unitsBox);

    if (card.attachments.length) {
      const attBox = document.createElement("div");
      const h2 = document.createElement("h3"); h2.textContent = "المرفقات: بتتلزق زي ما هي، إنت بس اكتب مكانها الـ placeholder";
      attBox.append(h2);
      const KIND = { code: "كود", traceback: "traceback", image: "صورة", details: "تفاصيل البيئة" };
      for (const a of card.attachments) {
        const d = document.createElement("details"); d.className = "att";
        const sm = document.createElement("summary");
        const ph = document.createElement("span"); ph.className = "ph"; ph.textContent = `[[A${a.id}]]`;
        const k = document.createElement("span"); k.className = "status-line"; k.textContent = KIND[a.kind] || a.kind;
        sm.append(ph, k);
        const pre = document.createElement("pre"); pre.textContent = a.text;
        d.append(sm, pre); attBox.append(d);
      }
      body.append(attBox);
    }
  }

  const ARABIC = /[؀-ۿ]/g, LATIN = /[A-Za-z]/g, PH = /\[\[A(\d+)\]\]/g;
  const stripCode = t => t.replace(PH, "").replace(/`[^`]*`/g, "");
  function arabicRatio(t) {
    const b = stripCode(t), a = (b.match(ARABIC) || []).length, l = (b.match(LATIN) || []).length;
    return a + l ? a / (a + l) : 0;
  }
  function validate(v, text, card) {
    if (!text.trim()) return [{ level: "bad", msg: "لسه فاضي" }];
    const out = [];
    const words = stripCode(text).trim().split(/\s+/).filter(Boolean).length;
    if (words < 8) out.push({ level: "bad", msg: `قصير أوي (${AR(words)} كلمة)، المطلوب ٨ على الأقل` });
    const ids = new Set(card.attachments.map(a => a.id));
    const refs = [...text.matchAll(PH)].map(m => Number(m[1]));
    const unknown = [...new Set(refs.filter(n => !ids.has(n)))];
    if (unknown.length) out.push({ level: "bad", msg: "placeholder مش موجود: " + unknown.map(n => `[[A${n}]]`).join("، ") });
    const missing = [...ids].filter(n => !refs.includes(n));
    if (missing.length) out.push({ level: "warn", msg: "مرفقات مش مستخدمة (هتتحط في الآخر): " + missing.map(n => `[[A${n}]]`).join("، ") });
    const r = arabicRatio(text);
    if (v.script === "arabic" && r < 0.5) out.push({ level: "bad", msg: "المفروض يكون بحروف عربي" });
    if (v.script === "latin" && r > 0.05) out.push({ level: "bad", msg: "المفروض يكون بحروف لاتيني بس" });
    for (const a of card.attachments) {
      const line = a.text.split("\n").map(s => s.trim()).find(s => s.length > 20 && !s.startsWith("```"));
      if (line && text.includes(line)) out.push({ level: "warn", msg: `شكلك لزقت الكود بتاع [[A${a.id}]] بدل الـ placeholder` });
    }
    return out.length ? out : [{ level: "ok", msg: "تمام" }];
  }
  const worst = checks => checks.some(c => c.level === "bad") ? "bad" : checks.some(c => c.level === "warn") ? "warn" : "ok";

  const localKey = id => "dt-draft:" + id;
  function draftFor(id) {
    const remote = state.mine[id], local = store.get(localKey(id), null);
    if (remote && (!local || (remote.updatedAt || 0) >= (local.updatedAt || 0))) return { ...remote };
    return local || { en: "", egy: "", franco: "", status: "draft", updatedAt: 0 };
  }
  let working = null;

  function renderEditor() {
    const id = state.selected, pane = $("editorPane");
    pane.textContent = "";
    if (!id) return;
    const card = BY_ID[id], s = taskStatus(id);
    const editable = (s === "mine" || s === "done-mine") && state.canWrite !== false;

    const rules = document.createElement("details");
    rules.className = "rules";
    rules.open = !store.get("dt-rules-seen", false);
    rules.addEventListener("toggle", () => { if (!rules.open) store.set("dt-rules-seen", true); });
    const rs = document.createElement("summary"); rs.textContent = "قواعد الكتابة (٦)";
    const ul = document.createElement("ul");
    for (const t of [
      "متفتحش الـ issue الأصلي. افهم المطلوب واكتب بطريقتك.",
      "كل النقط لازم تكون في طلبك، ومتزودش معلومة مش موجودة.",
      "مكان أي كود اكتب الـ placeholder بتاعه، زي \u2066[[A1]]\u2069، ومتلزقش الكود.",
      "أسماء الـ functions والـ classes تفضل بالإنجليزي زي ما هي.",
      "ممنوع أي AI أو أداة ترجمة.",
      "اكتب الإنجليزي، بعده المصري، بعده الفرانكو من المصري.",
    ]) { const li = document.createElement("li"); li.textContent = t; ul.append(li); }
    rules.append(rs, ul);
    pane.append(rules);

    if (!editable) {
      working = null;
      const gate = div("gate");
      const strong = document.createElement("strong"), p = document.createElement("p");
      if (s === "free") {
        strong.textContent = "التاسك ده متاح";
        p.textContent = "احجزه الأول عشان محدش تاني يكتب نفس التاسك، وبعدها هتظهرلك خانات الكتابة.";
        const b = button("احجز التاسك ده", () => claimTask(id));
        b.disabled = !state.dbReady || state.canWrite === false;
        gate.append(strong, p, b);
      } else if (state.canWrite === false) {
        strong.textContent = "صلاحيتك قراءة بس"; p.textContent = "اطلب من صاحب الصفحة يخليك Contributor عشان تقدر تكتب."; gate.append(strong, p);
      } else {
        strong.textContent = s === "taken" ? "التاسك ده مع كاتب تاني" : "التاسك ده اتسلّم";
        p.textContent = "اختار تاسك تاني من الشريط اللي فوق، أو اعرض المتاح للحجز بس."; gate.append(strong, p);
      }
      pane.append(gate);
      return;
    }

    if (!working || working.id !== id) {
      const draft = draftFor(id);
      working = { id, updatedAt: draft.updatedAt || 0, fields: { en: draft.en || "", egy: draft.egy || "", franco: draft.franco || "" } };
    }

    const tabs = div("tabs", { role: "tablist" });
    const dots = {};
    for (const v of VARIANTS) {
      const t = document.createElement("button");
      t.type = "button"; t.className = "tab"; t.setAttribute("role", "tab");
      t.setAttribute("aria-selected", String(state.tab === v.key));
      const dot = document.createElement("span"); dot.className = "dot " + worst(validate(v, working.fields[v.key], card));
      dots[v.key] = dot;
      t.append(dot, document.createTextNode(v.label));
      t.addEventListener("click", () => { state.tab = v.key; renderEditor(); });
      tabs.append(t);
    }
    pane.append(tabs);

    const v = VARIANTS.find(x => x.key === state.tab);
    const ed = div("editor");
    const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = v.hint;
    ed.append(hint);
    if (v.key === "franco" && working.fields.egy.trim()) {
      const ref = div("reference", { dir: "rtl" });
      const st = document.createElement("strong"); st.textContent = "المصري اللي كتبته:";
      ref.append(st, document.createTextNode(working.fields.egy));
      ed.append(ref);
    }
    const ta = document.createElement("textarea");
    ta.id = "ta-" + v.key; ta.dir = v.dir; ta.lang = v.key === "egy" ? "ar-EG" : "en";
    ta.value = working.fields[v.key]; ta.spellcheck = v.key === "en";
    ta.setAttribute("aria-label", "طلب " + v.label);
    if (card.attachments.length) {
      const ins = div("inserts");
      ins.append(document.createTextNode("حط مكان المؤشر:"));
      for (const a of card.attachments) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = `[[A${a.id}]]`;
        b.addEventListener("click", () => insertAt(ta, `[[A${a.id}]]`));
        ins.append(b);
      }
      ed.append(ins);
    }
    const checks = document.createElement("ul"); checks.className = "checks";
    const paint = () => {
      const res = validate(v, ta.value, card);
      checks.textContent = "";
      for (const c of res) { const li = document.createElement("li"); li.className = c.level; li.textContent = c.msg; checks.append(li); }
      dots[v.key].className = "dot " + worst(res);
    };
    ta.addEventListener("input", () => { working.fields[v.key] = ta.value; paint(); scheduleSave(id); });
    paint();
    ed.append(ta, checks);
    pane.append(ed);

    const foot = div("foot");
    const status = document.createElement("span"); status.className = "status-line"; status.id = "saveStatus";
    status.textContent = s === "done-mine" ? "متسلّم. ينفع تعدّل وتسلّم تاني." : working.updatedAt ? "المسودة محفوظة" : "المسودة بتتحفظ لوحدها وإنت بتكتب";
    const actions = div("actions");
    if (s === "mine") actions.append(button("سيبه لحد تاني", () => releaseTask(id), true));
    actions.append(button(s === "done-mine" ? "سلّم التعديل" : "سلّم التلات صيغ", () => submit(id)));
    foot.append(status, actions);
    pane.append(foot);
  }

  function button(text, onClick, ghost) {
    const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (ghost ? " ghost" : "");
    b.textContent = text; b.addEventListener("click", onClick); return b;
  }
  function insertAt(ta, text) {
    const start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? start;
    ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
    ta.focus(); ta.selectionStart = ta.selectionEnd = start + text.length;
    ta.dispatchEvent(new Event("input"));
  }
  const setSaveStatus = t => { const s = $("saveStatus"); if (s) s.textContent = t; };

  const timers = {}, inflight = {};
  function scheduleSave(id) {
    if (!working || working.id !== id) return;
    working.updatedAt = Date.now();
    store.set(localKey(id), { ...working.fields, status: (state.mine[id] || {}).status || "draft", updatedAt: working.updatedAt });
    setSaveStatus("بيتحفظ...");
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => saveDraft(id, null, false), 1800);
  }
  async function saveDraft(id, forceStatus, announce) {
    clearTimeout(timers[id]);
    if (!working || working.id !== id) return false;
    if (!state.db || !state.uid) { setSaveStatus("محفوظ على جهازك بس، لحد ما الاتصال يرجع"); return false; }
    if (inflight[id]) await inflight[id];
    const prev = state.mine[id] || {};
    const body = { ...working.fields, status: forceStatus || prev.status || "draft", updatedAt: Date.now() };
    const p = state.db.doc(`subs/${state.uid}/tasks/${id}`).set(body);
    inflight[id] = p.catch(() => {});
    try { await p; setSaveStatus("المسودة محفوظة"); if (announce) toast("اتحفظت"); return true; }
    catch (e) {
      setSaveStatus("الحفظ فشل، النص محفوظ على جهازك");
      if (e && e.code === "invalid_argument") { state.canWrite = false; notice("صلاحيتك على الصفحة دي قراءة بس. اطلب من صاحبها يخليك Contributor."); }
      return false;
    } finally { inflight[id] = null; }
  }
  async function submit(id) {
    const card = BY_ID[id];
    const broken = VARIANTS.filter(v => validate(v, working.fields[v.key], card).some(c => c.level === "bad"));
    if (broken.length) { state.tab = broken[0].key; renderEditor(); toast("صلّح الحاجات الحمرا في: " + broken.map(v => v.label).join("، ")); return; }
    if (!(await saveDraft(id, "submitted", false))) return;
    try { await state.db.doc("claims/" + id).set({ uid: state.uid, status: "submitted", at: Date.now() }); toast("اتسلّم، شكراً!"); }
    catch { toast("النص اتحفظ بس حالة التاسك متحدّثتش. جرّب تاني."); }
  }
  async function claimTask(id) {
    if (!state.db || !state.uid) return;
    const ref = state.db.doc("claims/" + id);
    try {
      const lease = await ref.acquire({ holder: state.uid, ttlMs: 5000 });
      if (!lease.acquired) { toast("حد تاني بيحجزه دلوقتي. جرّب بعد ثواني."); return; }
      const snap = await ref.get(), cur = snap.exists ? snap.data() : null;
      if (cur && cur.uid && cur.uid !== state.uid) { toast("التاسك ده اتحجز خلاص."); return; }
      state.tab = "en";
      await ref.set({ uid: state.uid, status: "claimed", at: Date.now() });
      toast("اتحجز. ابدأ بالإنجليزي.");
    } catch (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; notice("صلاحيتك على الصفحة دي قراءة بس. اطلب من صاحبها يخليك Contributor."); renderEditor(); }
      else toast("الحجز فشل. جرّب تاني.");
    }
  }
  async function releaseTask(id) {
    try {
      const snap = await state.db.doc("claims/" + id).get(), cur = snap.exists ? snap.data() : null;
      if (cur && cur.uid === state.uid && cur.status !== "submitted") await state.db.doc("claims/" + id).delete();
      toast("سيبت التاسك.");
    } catch { toast("مقدرتش أسيب التاسك. جرّب تاني."); }
  }

  function select(id) {
    if (!id || !BY_ID[id]) return;
    if (state.selected !== id) { state.tab = "en"; working = null; }
    state.selected = id;
    store.set("dt-selected", id);
    renderPicker(); renderBrief(); renderEditor();
  }
  function step(delta) {
    const list = visibleTasks(), idx = list.findIndex(c => c.instance_id === state.selected);
    const next = list[idx + delta]; if (next) select(next.instance_id);
  }
  $("taskSelect").addEventListener("change", e => select(e.target.value));
  $("prevBtn").addEventListener("click", () => step(-1));
  $("nextBtn").addEventListener("click", () => step(1));
  $("filterSelect").addEventListener("change", e => {
    state.filter = e.target.value;
    const list = visibleTasks();
    if (list.length && !list.some(c => c.instance_id === state.selected)) select(list[0].instance_id); else renderPicker();
  });

  const editingNow = () => document.activeElement && document.activeElement.tagName === "TEXTAREA";
  function refresh() {
    renderPicker(); renderBrief();
    if (!editingNow()) renderEditor();
  }

  const saved = store.get("dt-selected", null);
  select(BY_ID[saved] ? saved : CARDS[0].instance_id);

  (async () => {
    const timer = setTimeout(() => { if (!state.dbReady) notice("مش قادر أوصل لقاعدة البيانات دلوقتي. تقدر تقرا التاسكات، والكتابة هتتحفظ على جهازك لحد ما الاتصال يرجع."); }, 10000);
    const [user, db] = await Promise.all([window.claude?.use?.("user") ?? null, window.claude?.use?.("db") ?? null]);
    if (!db || !user) { clearTimeout(timer); notice("افتح الصفحة وإنت مسجّل دخول عشان تحجز وتسلّم. تقدر تتصفح التاسكات دلوقتي."); return; }
    state.uid = await user.id();
    state.canWrite = await user.can("data.write");
    if (!state.uid) { clearTimeout(timer); notice("مقدرتش أعرف حسابك على الصفحة دي، فالحجز والحفظ مقفولين."); return; }
    if (state.canWrite === false) notice("صلاحيتك على الصفحة دي قراءة بس. اطلب من صاحبها يخليك Contributor عشان تكتب.");
    state.db = db;
    db.collection("claims").onSnapshot(snap => {
      const next = {}; for (const d of snap.docs) next[d.id] = d.data();
      state.claims = next;
      if (!snap.metadata.fromCache && !state.dbReady) { state.dbReady = true; clearTimeout(timer); if ($("notice").textContent.startsWith("مش قادر")) notice(""); }
      refresh();
    }, () => { clearTimeout(timer); notice("الاتصال بقاعدة البيانات اتقطع. اعمل refresh للصفحة."); });
    db.collection(`subs/${state.uid}/tasks`).onSnapshot(snap => {
      const next = {}; for (const d of snap.docs) next[d.id] = d.data();
      state.mine = next;
    }, () => {});
  })();
})();
</script>
